# GitHub Pages Configuration for Kienyeji Farm Website

# Build settings
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Site settings
title: "Kienyeji Farm Fresh - Free-Range Improved Kienyeji Chicken"
description: "Order fresh, free-range Kienyeji chicken in Kenya. Naturally raised, farm to table indigenous chicken with rich flavor and unbeatable nutrition."
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://kienyejifarmfresh.co.ke"

# SEO and social
lang: en_US
author: "Kienyeji Farm Fresh"
twitter:
  username: 
  card: summary_large_image

# Include/exclude files
include:
  - _pages
exclude:
  - README.md
  - .gitignore
  - vendor
  - node_modules
  # Internal notes and test pages - keep them off the public site
  - "*.md"
  - test-results.html
  - changes-summary.html
  - "chicken website pattern.jpg"

# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

# Sass settings
sass:
  style: compressed

# Collections and defaults
defaults:
  - scope:
      path: "email-template.html"
    values:
      sitemap: false